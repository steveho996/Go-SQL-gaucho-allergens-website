<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaucho Allergens</title>
<style>
  body { font-family: sans-serif; background: #faf7f2; margin: 0; padding: 20px;
         display: flex; flex-direction: column; align-items: center; }
  h1 { margin: 30px 0 6px; }
  p.sub { color: #666; margin-bottom: 30px; }
  .roles { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; width: 100%; }
  a.role { flex: 1 1 240px; max-width: 320px; text-align: center; text-decoration: none;
           color: #fff; padding: 50px 20px; border-radius: 14px; font-size: 1.6rem; }
  a.role small { display: block; font-size: 1rem; margin-top: 8px; opacity: .9; }
  .waiter { background: #1e8449; }
  .chef   { background: #333; }
</style>
</head>
<body>
  <h1>Gaucho Helsinki</h1>
  <p class="sub">Allergen information. Choose your role.</p>
  <div class="roles">
    <a class="role waiter" href="/waiter">Waiter<small>Check what can be served</small></a>
    <a class="role chef" href="/admin">Chef<small>Update ingredients (password)</small></a>
  </div>
</body>
</html>
