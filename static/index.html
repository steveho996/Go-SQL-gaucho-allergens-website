<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaucho Allergens</title>
<link rel="stylesheet" href="/style.css">
<style>
  .hero { text-align: center; max-width: 900px; margin: 0 auto; }
  .hero h1 { font-size: clamp(1.6rem, 5vw, 2.6rem); line-height: 1.15; margin: 24px 0 6px; }
  .hero p  { color: var(--muted); margin: 0 0 18px; }
  .cuts-card { background: #FCFCFC; border-radius: 16px; padding: 12px;
             max-width: 640px; margin: 0 auto 24px; }
  .cuts { width: 100%; height: auto; display: block; }
  .roles { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  a.role { flex: 1 1 240px; max-width: 320px; text-decoration: none; padding: 38px 16px;
           border-radius: 14px; font-size: 1.7rem; text-transform: uppercase; }
  a.role small { display: block; font-size: 1rem; margin-top: 6px; text-transform: none; opacity: .9; }
  .waiter { background: var(--cream); color: #1b2610; }
  .chef   { background: var(--deep); color: var(--cream); border: 2px solid var(--cream); }
</style>
</head>
<body>
  <div class="hero">
    <h1>Gaucho Helsinki</h1>
    <p>Allergen information for the team. Choose your role.</p>
    <div class="cuts-card">
    <img class="cuts" src="/cuts.jpg" alt="Beef cuts diagram">
    </div>
    <div class="roles">
      <a class="role waiter" href="/waiter">Waiter<small>Check what can be served</small></a>
      <a class="role chef" href="/admin">Chef<small>Update ingredients (password)</small></a>
    </div>
  </div>
</body>
</html>
